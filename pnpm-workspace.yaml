# better-sqlite3 is a native module and must compile its binding on install.
# esbuild ships a platform binary that its install script unpacks (tsx/vitest).
allowBuilds:
  better-sqlite3: true
  esbuild: true

# Match the Docker build: Corepack fetches a recent pnpm there, which refuses
# packages published less than a day ago. Resolving under the same rule here
# keeps a fresh lockfile from failing the image build.
minimumReleaseAge: 1440
